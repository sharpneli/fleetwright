<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<title>Immune Zone Mockup</title>
<!-- The Protection tab's pane (1270 x 552 at 1920 x 1080) with the Immune zone tab (docs/designer-ui/immune-zone.md IZ3).
     The left half is the game's own pane (png/immune-base.png, a capture of 2026-11-14) under the run's dots; the right
     column is the new tab, drawn live from real runs (immune-data.js: shipgen immune bismarck ... --json).
     Second pass (2026-11-14, the user: "way too information dense"): the chart alone, a headline, and in words what hits
     at the range picked on the chart do to her.
     URL: ?cal=305  ?v=mach|mag  ?km=N (the range picked)  ?hover=R,A (a cell's tip: range index, angle index)
     ?tab=plate (the right column as it is today) -->
<style>
@font-face{font-family:'Saira Extra Condensed';font-weight:700;src:url(assets/fonts/saira-extra-condensed-latin-700-normal.woff2)}
@font-face{font-family:'Barlow Condensed';font-weight:400;src:url(assets/fonts/barlow-condensed-latin-400-normal.woff2)}
@font-face{font-family:'Barlow Condensed';font-weight:600;src:url(assets/fonts/barlow-condensed-latin-600-normal.woff2)}
@font-face{font-family:'Red Hat Mono';font-weight:400;src:url(assets/fonts/red-hat-mono-latin-400-normal.woff2)}
:root{
  --ground:#181B1C;--panel:#242728;--inset:#141616;--line:#303536;--edge:#0A0B0C;--header:#1E2122;
  --text:#D5D6D7;--bright:#F5F5F5;--muted:#919597;--faint:#586164;
  --brass:#E8772E;--brass-dark:#5C3416;--brass-darker:rgba(232,119,46,.16);--amber:#E8B64A;--ok:#8DBE6B;--red:#E04A3C;
  --btn:#333839;--border:#3D4345;
  --font-head:'Saira Extra Condensed','Arial Narrow',sans-serif;--font-ui:'Barlow Condensed','Arial Narrow',sans-serif;
  --font-data:'Red Hat Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--edge);font:13px/1.3 var(--font-ui);color:var(--text)}
#pane{position:relative;width:1270px;height:552px;overflow:hidden;background:var(--ground) url(png/immune-base.png) no-repeat}
#dots{position:absolute;left:0;top:0;pointer-events:none}
#col{position:absolute;left:741px;top:24px;width:529px;height:528px;background:var(--panel);border-left:1px solid var(--edge);display:flex;flex-direction:column}
.sub{height:20px;flex:none;display:flex;align-items:center;gap:6px;padding:0 6px;color:var(--muted);font-size:12px;background:var(--header);border-bottom:1px solid var(--line);white-space:nowrap}
.cap{color:var(--text);font-family:var(--font-head);font-weight:700;text-transform:uppercase;letter-spacing:.12em;font-size:11px}
.tab{padding:0 7px;height:20px;line-height:20px;color:var(--muted);cursor:pointer;font-family:var(--font-head);font-weight:700;text-transform:uppercase;letter-spacing:.1em;font-size:11px}
.tab i{font-style:normal;font-family:var(--font-data);font-size:9.5px;border:1px solid currentColor;padding:0 2px;margin-right:4px}
.tab.on{color:var(--brass);background:var(--brass-darker);box-shadow:inset 0 -2px 0 var(--brass)}
.r{margin-left:auto;display:flex;gap:4px;align-items:center}
.step{display:inline-flex;align-items:center;height:16px;border:1px solid var(--border);background:var(--inset)}
.step b{width:14px;text-align:center;color:var(--muted);cursor:pointer;font-weight:400;font-size:10px}
.step span{font-family:var(--font-data);font-size:11px;color:var(--bright);padding:0 4px;min-width:52px;text-align:center}
.seg{display:inline-flex;border:1px solid var(--border)}
.seg span{padding:0 6px;height:14px;line-height:14px;font-size:11.5px;color:var(--muted);cursor:pointer;background:var(--inset)}
.seg span.on{color:var(--brass);background:var(--brass-darker)}
.head{padding:8px 10px 0;font-size:17px;font-weight:600;color:var(--bright)}
.why{padding:1px 10px 0;font-size:12.5px;color:var(--muted)}
#chart{display:block;margin:2px auto 0}
.key{display:flex;justify-content:center;gap:16px;font-size:12px;color:var(--muted)}
.key i{display:inline-block;width:10px;height:10px;margin-right:5px;vertical-align:-1px}
.anger{margin-top:auto;border-top:1px solid var(--line);padding:6px 10px 8px;font-size:13px;line-height:1.45}
.anger .cap{color:var(--brass)}
.anger .hint{margin-left:8px;color:var(--muted);font-size:12px}
.anger b{color:var(--bright);font-weight:600}
</style></head>
<body>
<div id="pane">
  <canvas id="dots" width="1270" height="552"></canvas>
  <div id="col"></div>
</div>
<script src="immune-data.js"></script>
<script>
const q = new URLSearchParams(location.search);
const S = {cal: +(q.get('cal') || 380), v: q.get('v') === 'mag' ? 0 : 1, km: q.has('km') ? +q.get('km') : 15, hover: q.get('hover'), tab: q.get('tab') || 'iz'};
const C = {red: '#E04A3C', amber: '#E8B64A', muted: '#919597', bright: '#F5F5F5', plan: '#B0B3B4'};
const h = (t, a = {}, ...k) => { const e = document.createElement(t); for (const [n, x] of Object.entries(a)) n === 'on' ? e.onclick = x : e.setAttribute(n, x);
  for (const c of k.flat()) if (c != null) e.append(c.nodeType ? c : document.createTextNode(c)); return e; };
const Z = () => IZ.zones[S.cal], A = () => IZ.anger[S.cal], V = () => Z().vitals[S.v];
const kmOf = m => Math.round(m / 1000);
const band = () => A().bands.find(b => S.km * 1000 >= b.from && S.km * 1000 < b.to) ?? A().bands[0];

// three states only: safe (fewer than half get in, or nothing can reach them), through the side, through the deck
function state(c) {
  const [shots, side, deck] = c;
  if (shots === 0) return 'safe';
  if (side / shots >= 0.5) return 'side';
  if (deck / shots >= 0.5) return 'deck';
  return 'safe';
}
const fill = {side: C.red, deck: C.amber, safe: '#3E5A36'};

function chart() {
  const R = 160, W = R + 70, H = 2 * R + 26, cv = h('canvas', {id: 'chart', width: W, height: H}), g = cv.getContext('2d');
  const z = Z(), v = V(), cx = 30, cy = H / 2, n = z.ranges.length, reach = z.reachM, rOf = m => m / reach * R;
  z.angles.forEach((ang, ai) => {
    const a0 = Math.max(0, ang - 7.5) * Math.PI / 180 - Math.PI / 2, a1 = Math.min(180, ang + 7.5) * Math.PI / 180 - Math.PI / 2;
    for (let r = 0; r < n; r++) {
      g.beginPath(); g.arc(cx, cy, rOf(z.ranges[r]), a0, a1); g.arc(cx, cy, rOf(z.ranges[r] - 1000), a1, a0, true); g.closePath();
      g.fillStyle = fill[state(v.cells[r][ai])]; g.fill();
    }
  });
  // rings every 10 km, labelled on the beam
  g.strokeStyle = 'rgba(10,11,12,.55)'; g.lineWidth = 1; g.font = '11px "Red Hat Mono", monospace';
  for (let m = 10000; m < reach; m += 10000) { g.beginPath(); g.arc(cx, cy, rOf(m), -Math.PI / 2, Math.PI / 2); g.stroke(); }
  // the range picked
  g.strokeStyle = C.bright; g.lineWidth = 1.5; g.setLineDash([4, 3]);
  g.beginPath(); g.arc(cx, cy, rOf(S.km * 1000), -Math.PI / 2, Math.PI / 2); g.stroke(); g.setLineDash([]);
  g.fillStyle = C.bright;
  for (let m = 10000; m < reach; m += 10000) g.fillText(m / 1000, cx + rOf(m) - 13, cy + 4);
  g.fillStyle = C.muted; g.fillText('km', cx + R + 4, cy + 4); g.fillText('bow', cx - 10, 10); g.fillText('stern', cx - 17, H - 2);
  // her plan, bow up
  g.fillStyle = '#3A4042'; g.strokeStyle = C.plan; g.beginPath(); g.moveTo(cx, cy - 16); g.quadraticCurveTo(cx + 5, cy - 4, cx + 4, cy + 14);
  g.lineTo(cx - 4, cy + 14); g.quadraticCurveTo(cx - 5, cy - 4, cx, cy - 16); g.fill(); g.stroke();
  // hover: one line by the cursor
  if (S.hover) {
    const [r, ai] = S.hover.split(',').map(Number), c = v.cells[r]?.[ai];
    if (c) {
      const t = c[0] === 0 ? `${z.ranges[r] / 1000} km, ${z.angles[ai]}° off the bow: out of reach`
        : `${z.ranges[r] / 1000} km, ${z.angles[ai]}° off the bow: ${Math.round(100 * (c[1] + c[2]) / c[0])} % get in`;
      const a = (z.angles[ai] - 90) * Math.PI / 180, x = cx + Math.cos(a) * rOf(z.ranges[r]), y = cy + Math.sin(a) * rOf(z.ranges[r]);
      g.font = '12px "Barlow Condensed", "Arial Narrow", sans-serif'; const w = g.measureText(t).width + 10, bx = Math.min(x + 8, W - w - 2), by = Math.max(4, y - 22);
      g.fillStyle = '#141616'; g.fillRect(bx, by, w, 18); g.strokeStyle = '#3D4345'; g.strokeRect(bx, by, w, 18);
      g.fillStyle = C.bright; g.fillText(t, bx + 5, by + 13);
    }
  }
  cv.onmousemove = e => {
    const x = e.offsetX - cx, y = e.offsetY - cy, d = Math.hypot(x, y);
    if (x < 0 || d > R) { if (S.hover) { S.hover = null; render(); } return; }
    const ai = Math.round(Math.atan2(x, -y) * 180 / Math.PI / 15), r = Math.max(0, Math.ceil(d / R * reach / 1000) - 1);
    if (r < n && S.hover !== `${r},${ai}`) { S.hover = `${r},${ai}`; render(); }
  };
  cv.onclick = e => { const d = Math.hypot(e.offsetX - cx, e.offsetY - cy); if (d <= R) { S.km = Math.max(1, Math.round(d / R * reach / 1000)); render(); } };
  return cv;
}

// the zone in a sentence, and what sets its edges
function headline() {
  const z = Z(), v = V(), beam = z.angles.indexOf(90), [inner, outer] = v.edges[beam];
  const ri = Math.max(0, Math.round(inner / 1000) - 1), ro = Math.min(z.ranges.length - 1, Math.round(outer / 1000) - 1);
  const head = inner <= 0 && outer >= z.reachM ? 'Immune at every range on the beam' : inner < outer ? `Immune from ${kmOf(inner)} to ${kmOf(outer)} km on the beam` : 'Not immune on the beam';
  const why = [];
  if (inner > 0) why.push(`Inside ${kmOf(inner)} km shells get through the ${v.sideBy[ri][beam] || 'side'}.`);
  if (outer < z.reachM) why.push(`Beyond ${kmOf(outer)} km they come down through the ${v.deckBy[ro][beam] || 'deck'}.`);
  if (!why.length) why.push(`Her own ${S.cal} mm can't get into her ${v.vitals.toLowerCase()} at any range.`);
  return [h('div', {class: 'head'}, head), h('div', {class: 'why'}, why.join(' '))];
}

// shells fired in anger at the range picked, in words
function anger() {
  const a = A(), b = band(), n = b.ships, turrets = Math.round(4 * b.guns);
  const how = ['magazine', 'flooding', 'capsized', 'broke in two'][b.lostBy.indexOf(Math.max(...b.lostBy))];
  const lost = b.lost === 0 ? `All ${n} ships stay afloat.` : `${b.lost} of ${n} ships are lost (most to ${how}).`;
  return h('div', {class: 'anger'},
    h('div', {}, h('span', {class: 'cap'}, `${a.hitsPerShip} hits at ${kmOf(b.from)}-${kmOf(b.to)} km`), h('span', {class: 'hint'}, 'click the chart for another range')),
    h('div', {}, h('b', {}, lost), ` On average she takes ${Math.round(b.waterT / 100) * 100} t of water and keeps `,
      h('b', {}, `${Math.round(100 * b.speed)} %`), ' of her speed and ', h('b', {}, `${turrets} of 4`), ' turrets firing.'));
}

// where the hits at that range struck, on the elevation
function dots() {
  const cv = document.getElementById('dots'), g = cv.getContext('2d'), a = A(), b = band();
  g.clearRect(0, 0, cv.width, cv.height);
  if (S.tab !== 'iz') return;
  const L = a.lengthM, wl = a.waterline, keel = -a.depth;
  const X = x => 67 + (x + L / 2) / L * 656, Y = zz => zz >= wl ? 101 + (0 - zz) / (0 - wl) * 31 : 132 + (wl - zz) / (wl - keel) * 58;
  // two kinds only: burst inside her, or not (held by armour, through, a dud); the upper works faint (not drawn here)
  for (const [x, , zz, k] of b.dots) {
    g.fillStyle = k === 0 ? C.red : C.plan; g.globalAlpha = zz > 0.5 ? 0.3 : 0.85; g.beginPath(); g.arc(X(x), Y(zz), 2.2, 0, 7); g.fill();
  }
  g.globalAlpha = 1; g.font = '12px "Barlow Condensed", "Arial Narrow", sans-serif';
  g.fillStyle = '#1E2122'; g.fillRect(208, 26, 330, 16);
  let x = 214; g.fillStyle = C.bright;
  const t = `where ${a.hitsPerShip} hits at ${kmOf(b.from)}-${kmOf(b.to)} km struck:`; g.fillText(t, x, 38); x += g.measureText(t).width + 12;
  for (const [txt, col] of [['burst inside', C.red], ['held or passed', C.plan]]) {
    g.fillStyle = col; g.beginPath(); g.arc(x, 34, 3.2, 0, 7); g.fill();
    g.fillStyle = C.muted; g.fillText(txt, x + 7, 38); x += g.measureText(txt).width + 22;
  }
}

function render() {
  const col = document.getElementById('col');
  col.replaceChildren(h('div', {class: 'sub'},
    h('span', {class: 'tab' + (S.tab === 'plate' ? ' on' : ''), on: () => { S.tab = 'plate'; render(); }}, h('i', {}, 'S'), 'Sections · plate'),
    h('span', {class: 'tab' + (S.tab === 'iz' ? ' on' : ''), on: () => { S.tab = 'iz'; render(); }}, h('i', {}, 'I'), 'Immune zone')));
  col.style.background = S.tab === 'plate' ? 'transparent' : '';
  if (S.tab === 'iz') {
    const cals = [380, 305], ci = cals.indexOf(S.cal);
    col.append(h('div', {class: 'sub'}, h('span', {class: 'cap'}, 'Against her own'),
      h('span', {class: 'step'}, h('b', {on: () => { S.cal = cals[Math.min(1, ci + 1)]; render(); }}, '◀'), h('span', {}, `${S.cal} mm`),
        h('b', {on: () => { S.cal = cals[Math.max(0, ci - 1)]; render(); }}, '▶')),
      h('span', {class: 'r'}, h('span', {class: 'seg'}, ['Magazines', 'Machinery'].map((t, i) =>
        h('span', {class: i === S.v ? 'on' : '', on: () => { S.v = i; render(); }}, t))))));
    col.append(...headline(), chart(),
      h('div', {class: 'key'}, h('span', {}, h('i', {style: 'background:' + fill.safe}), 'safe'),
        h('span', {}, h('i', {style: 'background:' + C.red}), 'through the side'), h('span', {}, h('i', {style: 'background:' + C.amber}), 'through the deck')),
      anger());
  }
  dots();
}
render();
</script>
</body></html>
