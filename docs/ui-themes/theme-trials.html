*{box-sizing:border-box}
body{background:var(--ground);color:var(--text);font-family:var(--f-ui);font-size:var(--ui-size);transition:background .25s}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-data);font-size:var(--data-size);font-variant-numeric:tabular-nums}

/* ---------- lab chrome ---------- */
.wrap{max-width:1440px;margin:0 auto;padding-inline:16px;padding-block:18px 40px;display:flex;flex-direction:column;gap:16px}
.masthead{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 24px;justify-content:space-between}
.masthead h1{margin:0;font-family:var(--f-head);font-weight:var(--head-wt);font-style:var(--head-style);font-size:30px;line-height:1;color:var(--bright);text-transform:var(--head-tt);letter-spacing:var(--head-ls);text-shadow:var(--glow);text-wrap:balance}
.masthead .eyebrow{font-family:var(--f-data);font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
.views{display:flex;gap:2px;padding:2px;background:var(--panel);border:1px solid var(--edge);border-radius:var(--radius)}
.views button{border:none;background:none;padding:5px 12px;color:var(--muted);border-radius:var(--radius)}
.views button[aria-pressed="true"]{background:var(--accent-bg);color:var(--bright);box-shadow:inset 0 -2px 0 var(--accent)}
.picker{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px}
.pk{display:flex;flex-direction:column;gap:6px;text-align:left;padding:8px 10px 9px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);color:var(--text)}
.pk:hover{border-color:var(--faint)}
.pk[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.pk .sw{display:flex;height:14px;border:1px solid rgba(0,0,0,.35)}
.pk .sw i{flex:1}
.pk .nm{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.pk .nm b{font-weight:600;color:var(--bright)}
.pk .nm span{font-family:var(--f-data);font-size:10px;color:var(--muted)}
.brief{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px 28px;padding:16px 18px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius)}
.brief h2{margin:0 0 6px;font-family:var(--f-head);font-weight:var(--head-wt);font-style:var(--head-style);text-transform:var(--head-tt);letter-spacing:var(--head-ls);font-size:22px;color:var(--acc-tx);text-shadow:var(--glow)}
.brief p{margin:0 0 8px;max-width:64ch;line-height:1.45}
.brief .src{color:var(--muted);font-size:.95em}
.brief .src b{color:var(--text);font-weight:600}
.brief .verdict{display:flex;gap:8px;align-items:baseline;padding-top:8px;border-top:1px solid var(--line);color:var(--text)}
.brief .verdict em{font-style:normal;font-family:var(--f-data);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--acc-tx);flex:none}
.tokens{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px}
.tok{display:flex;flex-direction:column;gap:3px;font-family:var(--f-data);font-size:10px;color:var(--muted)}
.tok i{height:26px;border:1px solid var(--edge);border-radius:var(--radius)}
.tok b{font-weight:400;color:var(--text)}
.specimen{display:flex;flex-direction:column;gap:4px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.specimen div{display:flex;gap:10px;align-items:baseline;min-width:0}
.specimen small{flex:none;width:44px;font-family:var(--f-data);font-size:9.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em}
.specimen .h{font-family:var(--f-head);font-weight:var(--head-wt);font-style:var(--head-style);text-transform:var(--head-tt);letter-spacing:var(--head-ls);font-size:16px;color:var(--bright)}
.specimen .u{font-size:14px;color:var(--text)}
.specimen .d{font-family:var(--f-data);font-size:13px;color:var(--bright);font-variant-numeric:tabular-nums}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{padding:6px 12px;border:1px solid var(--faint);background:var(--panel2);border-radius:var(--radius);color:var(--text)}
.btn:hover{color:var(--bright);border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
#copyOut{display:none;width:100%;height:140px;margin-top:8px;font-family:var(--f-data);font-size:11px;background:var(--inset);color:var(--text);border:1px solid var(--line)}
.toast{font-family:var(--f-data);font-size:11px;color:var(--ok);align-self:center}
.figure{display:flex;flex-direction:column;gap:6px}
.figure .cap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-family:var(--f-data);font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.figure .cap b{color:var(--text);font-weight:500}
.frame{position:relative;width:100%;overflow:hidden;border:1px solid var(--edge);box-shadow:0 10px 40px rgba(0,0,0,.35)}
.stage{position:absolute;left:0;top:0;width:1280px;height:640px;transform-origin:0 0;overflow:hidden;background:var(--ground);font-family:var(--f-ui);font-size:var(--ui-size);color:var(--text);user-select:none}
.stage::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:50;opacity:var(--scan);
  background:repeating-linear-gradient(rgba(0,0,0,.22) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,.55))}
@media (max-width:760px){.brief{grid-template-columns:1fr}.masthead h1{font-size:24px}}

/* ---------- shared stage bits ---------- */
.ph{height:20px;display:flex;align-items:center;gap:8px;padding:0 8px;background:var(--hd);border-bottom:1px solid var(--edge);
  font-family:var(--f-head);font-weight:var(--head-wt);font-style:var(--head-style);font-size:var(--head-size);letter-spacing:var(--head-ls);text-transform:var(--head-tt);color:var(--hd-text);white-space:nowrap;text-shadow:var(--glow)}
.ph .rt{margin-left:auto;font-family:var(--f-ui);font-style:normal;font-weight:400;font-size:10.5px;letter-spacing:0;text-transform:none;color:var(--hd-muted)}
.kbd{font-family:var(--f-data);font-size:9.5px;border:1px solid var(--faint);border-radius:2px;padding:0 3px;color:var(--muted)}
.t-mut{color:var(--muted)}.t-acc{color:var(--acc-tx)}.t-warn{color:var(--warn)}.t-ok{color:var(--ok)}.t-bad{color:var(--bad)}.t-fr{color:var(--fr)}.t-ho{color:var(--ho)}
.glow{text-shadow:var(--glow)}

/* ---------- map ---------- */
#mapsvg{position:absolute;left:0;top:0;filter:var(--svgglow)}
.sea{fill:var(--sea)}.shoal{fill:var(--shoal)}.land{fill:var(--land);stroke:var(--landedge);stroke-width:1.2}
.hatch{opacity:var(--hatch)}.hatchln{stroke:var(--sea);stroke-width:3}
.hearts{opacity:var(--hearts)}.heartp{fill:var(--accent);opacity:.16}
.gridln{stroke:var(--grid);stroke-width:1}
.contour{fill:none;stroke:var(--contour);stroke-width:1;stroke-dasharray:5 4}
.glab{fill:var(--muted);font-family:var(--f-data);font-size:10px}
.snd{fill:var(--fr);opacity:calc(var(--snd)*.7);font-family:var(--f-head);font-style:italic;font-size:10px}
.seaname{fill:var(--muted);opacity:var(--seaname);font-family:var(--f-head);font-style:italic;font-size:22px;letter-spacing:.4em}
.trk{stroke-width:1.2;fill:none;opacity:.55}
.sh.fr ellipse{fill:var(--fr);stroke:var(--frfill);stroke-width:.8}.sh.fr .trk{stroke:var(--fr)}
.sh.ho ellipse{fill:var(--ho);stroke:var(--hofill);stroke-width:.8}.sh.ho .trk{stroke:var(--ho)}
.fire{stroke:var(--warn);stroke-width:1;stroke-dasharray:2 4;opacity:.55}
.brg{stroke:var(--ho);stroke-width:1;opacity:.6}
.brg.sus{stroke-dasharray:6 4}
.lbl{font-family:var(--f-ui);font-size:12px;font-weight:600;fill:var(--bright)}
.lbl2{font-family:var(--f-data);font-size:10.5px;fill:var(--muted)}
.lblho{font-family:var(--f-ui);font-size:12px;font-weight:600;fill:var(--ho)}
.sunk{stroke:var(--warn);stroke-width:1.6}.sunkt{fill:var(--warn);font-family:var(--f-data);font-size:10.5px}
.sel{fill:none;stroke:var(--accent);stroke-width:1.4}

function fleet(x,y,course,n,gap,side,rx){
  const r=course*Math.PI/180,dx=-Math.sin(r)*gap,dy=Math.cos(r)*gap;
  let s=`<g class="sh ${side}">`;
  const lx=x+dx*(n-1),ly=y+dy*(n-1);
  s+=`<line class="trk" x1="${lx+dx*3}" y1="${ly+dy*3}" x2="${x-dx*2.6}" y2="${y-dy*2.6}"/>`;
  for(let i=0;i<n;i++)s+=`<ellipse cx="${x+dx*i}" cy="${y+dy*i}" rx="${rx||7}" ry="2.3" transform="rotate(${course-90} ${x+dx*i} ${y+dy*i})"/>`;
  return s+'</g>';
}

   ['--font-head','--f-head'],['--font-ui','--f-ui'],['--font-data','--f-data']];
  return `/* Fleetwright skin: ${SKINS.find(s=>s.id===root.dataset.skin).name}. Names follow map.html / overview.html (--brass = accent, --amber = warning). */\n:root{\n${map.map(([a,b])=>`  ${a}:${g(b)};`).join('\n')}\n}`;
}
$('#copyBtn').addEventListener('click',()=>{
  const t=cssFor(),o=$('#copyOut');
  const show=()=>{o.value=t;o.style.display='block';o.select();$('#toast').textContent='Select and copy from the box below'};
  try{navigator.clipboard.writeText(t).then(()=>{$('#toast').textContent='Copied';o.value=t;o.style.display='block'},show)}catch(e){show()}
});
$('#picker').innerHTML=SKINS.map((s,i)=>`<button class="pk" data-id="${s.id}" aria-pressed="false"><span class="sw">${s.sw.map(c=>`<i style="background:${c}"></i>`).join('')}</span><span class="nm"><b>${s.name}</b><span>${i+1} · ${s.tag}</span></span></button>`).join('');
$('#picker').addEventListener('click',e=>{const b=e.target.closest('.pk');if(b)setSkin(b.dataset.id)});
document.addEventListener('keydown',e=>{if(e.target.tagName==='TEXTAREA')return;const n=+e.key;if(n>=1&&n<=SKINS.length)setSkin(SKINS[n-1].id)});
const V={'v-both':[1,1],'v-map':[1,0],'v-des':[0,1]};
Object.keys(V).forEach(id=>$('#'+id).addEventListener('click',()=>{
  Object.keys(V).forEach(k=>$('#'+k).setAttribute('aria-pressed',k===id));
  $('#figMap').hidden=!V[id][0];$('#figDes').hidden=!V[id][1];fit();
}));
buildMap();buildDes();
let start='gunmetal';try{const s=localStorage.getItem('fw-skin');if(s&&SKINS.some(k=>k.id===s))start=s}catch(e){}
setSkin(start);fit();
new ResizeObserver(fit).observe(document.querySelector('.wrap'));
</script>
